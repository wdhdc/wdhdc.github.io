<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎬 wdhdc · 视频播放器</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: rgba(24, 24, 27, .03);
    --panel-hover: rgba(24, 24, 27, .06);
    --border: rgba(24, 24, 27, .10);
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
    --accent2: #0d9488;
    --accent3: #f43f5e;
    --grad: linear-gradient(135deg, #2563eb, #0d9488, #f43f5e);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 480px at 88% -12%, rgba(37,99,235,.06), transparent 60%),
      radial-gradient(700px 420px at -8% 112%, rgba(13,148,136,.05), transparent 60%),
      var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- 头部 ---------- */
  header {
    padding: 26px 22px 18px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 {
    font-size: clamp(21px, 4vw, 28px);
    letter-spacing: 1px;
    background: var(--grad);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradMove 7s ease-in-out infinite;
  }
  @keyframes gradMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header p { margin-top: 6px; color: var(--muted); font-size: 13px; }
  header code { background: rgba(24,24,27,.05); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

  /* ---------- 主体 ---------- */
  main {
    flex: 1;
    width: min(1180px, 94vw);
    margin: 22px auto;
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ---------- 播放器 ---------- */
  .player-box { position: relative; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .video-fallback {
    display: none;
    aspect-ratio: 16/9;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted);
    background: #f4f4f5;
    padding: 24px;
  }
  .video-fallback .big { font-size: 40px; margin-bottom: 12px; }
  .player-meta { padding: 18px 20px 20px; }
  .player-meta h2 { font-size: 20px; }
  .player-meta .tags { margin: 10px 0 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .player-meta .date { color: var(--muted); font-size: 13px; }
  .player-meta .desc { color: var(--muted); font-size: 14px; line-height: 1.7; margin-top: 6px; }

  /* ---------- 侧边列表 ---------- */
  .playlist { display: flex; flex-direction: column; max-height: 78vh; }
  .pl-toolbar { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
  .pl-search {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .pl-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .pl-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 4px 10px; border-radius: 999px; font-size: 12px;
    color: var(--muted); border: 1px solid var(--border);
    cursor: pointer; user-select: none; background: #fff;
    transition: all .2s;
  }
  .tag:hover { color: var(--text); border-color: var(--accent); }
  .tag.active { color: #fff; background: var(--grad); border-color: transparent; font-weight: 600; }
  .pl-list { overflow-y: auto; padding: 10px; flex: 1; }
  .pl-list::-webkit-scrollbar { width: 8px; }
  .pl-list::-webkit-scrollbar-thumb { background: rgba(24,24,27,.14); border-radius: 8px; }

  .vitem {
    display: flex; gap: 12px; padding: 10px; border-radius: 12px;
    cursor: pointer; transition: background .2s, transform .2s;
    border: 1px solid transparent; margin-bottom: 6px;
  }
  .vitem:hover { background: var(--panel-hover); transform: translateX(3px); }
  .vitem.active { border-color: rgba(37,99,235,.4); background: rgba(37,99,235,.06); }
  .vthumb {
    width: 120px; flex: 0 0 120px; aspect-ratio: 16/9; border-radius: 8px;
    background: linear-gradient(135deg, #eef2ff, #ecfeff);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    overflow: hidden;
  }
  .vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vinfo { min-width: 0; flex: 1; }
  .vinfo .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vinfo .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .vinfo .tg { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
  .vitem .mini-tag {
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
  }
  .badge-new {
    display: inline-block; font-size: 10px; color: #fff;
    background: var(--grad); border-radius: 999px; padding: 1px 7px; margin-left: 6px;
    font-weight: 700; vertical-align: 1px; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ---------- 空状态 / 加载 / 错误 ---------- */
  .empty { text-align: center; padding: 46px 22px; color: var(--muted); }
  .empty .big { font-size: 46px; animation: floaty 3.5s ease-in-out infinite; display: inline-block; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .empty h3 { color: var(--text); margin: 14px 0 8px; font-size: 18px; }
  .empty p { font-size: 13px; line-height: 1.9; }
  .empty code { background: rgba(24,24,27,.06); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  .empty .steps { text-align: left; display: inline-block; margin-top: 10px; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--muted); }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { padding: 30px; text-align: center; color: #be123c; font-size: 14px; line-height: 1.9; }
  .error code { background: rgba(244,63,94,.1); padding: 2px 7px; border-radius: 6px; }

  footer {
    text-align: center; padding: 18px; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>🎬 wdhdc · 视频播放器</h1>
  <p>视频素材由 <a href="https://github.com/wdhdc/wdhdc.github.io" target="_blank">wdhdc.github.io</a> 仓库 <code>videos/</code> 文件夹提供 · 见 <a href="videos/%E9%9C%80%E8%A6%81%E4%BB%80%E4%B9%88%E6%96%87%E4%BB%B6.txt" target="_blank">需要什么文件.txt</a></p>
</header>

<main>
  <!-- 播放区 -->
  <section class="panel player-box">
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="video-fallback" id="videoFallback">
      <div>
        <div class="big">🎞️</div>
        <p id="fallbackMsg">视频文件无法播放，请检查该视频的 <code>info.json</code> 中 <code>file</code> 字段。</p>
      </div>
    </div>
    <div class="player-meta">
      <h2 id="mTitle">选择一个视频开始播放</h2>
      <div class="tags" id="mTags"></div>
      <div class="date" id="mDate"></div>
      <p class="desc" id="mDesc">左侧列表中的视频来自仓库 videos/ 文件夹。还没有视频时，按「需要什么文件.txt」的说明添加即可。</p>
    </div>
  </section>

  <!-- 列表区 -->
  <aside class="panel playlist">
    <div class="pl-toolbar">
      <input class="pl-search" id="search" type="text" placeholder="🔍 搜索标题 / 简介 / 标签…"/>
      <div class="pl-tags" id="tagBar"></div>
    </div>
    <div class="pl-list" id="list"></div>
  </aside>
</main>

<footer>
  <span>Powered by <a href="https://github.com/wdhdc/wdhdc.github.io" target="_blank">wdhdc/wdhdc.github.io</a> · jsDelivr CDN + GitHub raw · © 2026</span>
</footer>

<script>
(function () {
  "use strict";

  // ============ 配置 ============
  var REPO = "wdhdc/wdhdc.github.io";
  var BRANCH = "main";
  var DATA_PATH = "videos/data.json";
  var IS_LOCAL = !/[?&]local=0/.test(location.search); // 默认直连 GitHub Pages（相对路径，绕过CDN缓存）；?local=0 可切回CDN模式
  var CDN = IS_LOCAL ? "" : "https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/";
  var RAW = IS_LOCAL ? "" : "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";
  var API = IS_LOCAL ? "" : "https://api.github.com/repos/" + REPO + "/contents/";
  var DOC_URL = "videos/%E9%9C%80%E8%A6%81%E4%BB%80%E4%B9%88%E6%96%87%E4%BB%B6.txt";

  // ============ DOM ============
  var video = document.getElementById("video");
  var fallbackBox = document.getElementById("videoFallback");
  var fallbackMsg = document.getElementById("fallbackMsg");
  var mTitle = document.getElementById("mTitle");
  var mTags = document.getElementById("mTags");
  var mDate = document.getElementById("mDate");
  var mDesc = document.getElementById("mDesc");
  var searchEl = document.getElementById("search");
  var tagBar = document.getElementById("tagBar");
  var listEl = document.getElementById("list");

  var state = { videos: [], filtered: [], activeId: null, activeTag: "全部", query: "" };

  // ============ 数据加载 ============
  function fetchJson(urls) {
    if (!urls.length) return Promise.reject(new Error("no source"));
    return fetch(urls[0]).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch(function () { return fetchJson(urls.slice(1)); });
  }

  function loadData() {
    setLoading(true);
    var sources = [
      CDN + DATA_PATH + "?t=" + Date.now(),
      API + encodeURIComponent(DATA_PATH) + "?ref=" + BRANCH + "&t=" + Date.now()
    ];
    fetchJson(sources).then(function (raw) {
      var data = raw.content ? JSON.parse(decodeBase64(raw.content)) : raw;
      var list = (data && Array.isArray(data.videos)) ? data.videos : [];
      var jobs = list.map(function (item) { return loadInfo(item); });
      return Promise.all(jobs).then(function (vids) {
        vids = vids.filter(Boolean);
        vids.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
        state.videos = vids;
        renderAll();
        if (vids.length) playVideo(vids[0].id);
      });
    }).catch(function (err) {
      setLoading(false);
      showError("无法加载视频目录。请确认仓库 " + REPO + " 的 <code>videos/data.json</code> 存在，且格式正确。<br/>原始错误：" + (err && err.message ? err.message : err));
    });
  }

  function loadInfo(item) {
    var folder = String(item.folder || "").trim();
    if (!folder) return Promise.resolve(null);
    var infoUrl = CDN + "videos/" + encodeURIComponent(folder) + "/info.json?t=" + Date.now();
    var apiUrl = API + "videos/" + encodeURIComponent(folder) + "/info.json?ref=" + BRANCH;
    return fetchJson([infoUrl, apiUrl]).then(function (raw) {
      var info = raw.content ? JSON.parse(decodeBase64(raw.content)) : raw;
      if (!info || !info.file) return null;
      info.folder = folder;
      info.id = info.id || folder;
      info.tags = Array.isArray(info.tags) ? info.tags : [];
      info.cover = info.cover || "";
      return info;
    }).catch(function () { return null; });
  }

  function decodeBase64(b64) {
    if (typeof atob === "function") return decodeURIComponent(escape(atob(b64)));
    return b64;
  }

  function fileUrl(info, name) {
    return RAW + "videos/" + encodeURIComponent(info.folder) + "/" + encodeURIComponent(name);
  }

  // ============ 渲染 ============
  function setLoading(on) {
    listEl.innerHTML = on
      ? '<div class="loading"><div class="spinner"></div>正在加载视频目录…</div>'
      : "";
  }

  function showError(msg) {
    listEl.innerHTML = '<div class="error">⚠️ ' + msg + '<br/><br/><a href="' + DOC_URL + '" target="_blank">📄 查看「需要什么文件.txt」</a></div>';
  }

  function renderAll() {
    if (!state.videos.length) {
      listEl.innerHTML =
        '<div class="empty"><div class="big">🎬</div>' +
        '<h3>这里还没有视频</h3>' +
        '<div class="steps">' +
        '<p>1. 在仓库新建 <code>videos/视频名/</code> 文件夹</p>' +
        '<p>2. 放入视频文件 + <code>info.json</code>（含日期、标题、描述）</p>' +
        '<p>3. 在 <code>videos/data.json</code> 中登记：<code>{"folder":"视频名"}</code></p>' +
        '<p>4. 推送后刷新本页即可播放 ✨</p>' +
        '</div>' +
        '<p style="margin-top:14px"><a href="' + DOC_URL + '" target="_blank">📄 查看详细说明「需要什么文件.txt」</a></p>' +
        '</div>';
      return;
    }
    renderTags();
    applyFilter();
  }

  function renderTags() {
    var tagSet = {};
    state.videos.forEach(function (v) {
      (v.tags || []).forEach(function (t) { tagSet[t] = true; });
    });
    var tags = Object.keys(tagSet).sort();
    var html = '<button class="tag' + (state.activeTag === "全部" ? " active" : "") + '" data-tag="全部">全部</button>';
    tags.forEach(function (t) {
      html += '<button class="tag' + (state.activeTag === t ? " active" : "") + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + "</button>";
    });
    tagBar.innerHTML = html;
    tagBar.querySelectorAll(".tag").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTag = btn.getAttribute("data-tag");
        renderTags();
        applyFilter();
      });
    });
  }

  function applyFilter() {
    var q = state.query.toLowerCase();
    state.filtered = state.videos.filter(function (v) {
      var okTag = state.activeTag === "全部" || (v.tags || []).indexOf(state.activeTag) >= 0;
      var okQ = !q ||
        (v.title || "").toLowerCase().indexOf(q) >= 0 ||
        (v.description || "").toLowerCase().indexOf(q) >= 0 ||
        (v.tags || []).join(" ").toLowerCase().indexOf(q) >= 0;
      return okTag && okQ;
    });
    renderList();
  }

  function renderList() {
    if (!state.filtered.length) {
      listEl.innerHTML = '<div class="empty"><div class="big">🔍</div><h3>没有匹配的视频</h3><p>换个关键词或标签试试</p></div>';
      return;
    }
    var html = "";
    state.filtered.forEach(function (v) {
      var isActive = v.id === state.activeId;
      var cover = v.cover ? '<img src="' + fileUrl(v, v.cover) + '" loading="lazy" alt="cover" onerror="this.parentNode.textContent=\'🎬\'"/>' : "🎬";
      var tags = (v.tags || []).slice(0, 3).map(function (t) {
        return '<span class="mini-tag">' + escapeHtml(t) + "</span>";
      }).join("");
      html +=
        '<div class="vitem' + (isActive ? " active" : "") + '" data-id="' + escapeHtml(v.id) + '">' +
          '<div class="vthumb">' + cover + "</div>" +
          '<div class="vinfo">' +
            '<div class="t">' + escapeHtml(v.title || v.id) + (v.featured ? '<span class="badge-new">置顶</span>' : "") + "</div>" +
            '<div class="d">📅 ' + escapeHtml(v.date || "未知日期") + (v.duration ? " · ⏱ " + escapeHtml(v.duration) : "") + "</div>" +
            (tags ? '<div class="tg">' + tags + "</div>" : "") +
          "</div>" +
        "</div>";
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll(".vitem").forEach(function (el) {
      el.addEventListener("click", function () { playVideo(el.getAttribute("data-id")); });
    });
  }

  // ============ 播放 ============
  function playVideo(id) {
    var v = state.videos.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    state.activeId = id;
    var src = fileUrl(v, v.file);
    video.src = src;
    fallbackBox.style.display = "none";
    video.style.display = "block";
    video.load();
    var p = video.play();
    if (p && p.catch) p.catch(function () { /* 自动播放被拦截，等待用户点击 */ });

    video.onerror = function () {
      var cdnSrc = CDN + "videos/" + encodeURIComponent(v.folder) + "/" + encodeURIComponent(v.file);
      if (video.currentSrc !== cdnSrc) {
        video.src = cdnSrc;
        video.load();
        video.onerror = function () {
          video.style.display = "none";
          fallbackMsg.innerHTML = "视频文件 <code>" + escapeHtml(v.file) + "</code> 无法播放。请确认文件已上传到 <code>videos/" + escapeHtml(v.folder) + "/</code>，且格式为浏览器支持的 MP4 / WebM。";
          fallbackBox.style.display = "flex";
        };
      } else {
        video.style.display = "none";
        fallbackMsg.innerHTML = "视频文件 <code>" + escapeHtml(v.file) + "</code> 无法播放。请确认文件已上传到 <code>videos/" + escapeHtml(v.folder) + "/</code>，且格式为浏览器支持的 MP4 / WebM。";
        fallbackBox.style.display = "flex";
      }
    };

    mTitle.textContent = v.title || v.id;
    mDate.textContent = "📅 " + (v.date || "未知日期") + (v.duration ? "  ·  ⏱ " + v.duration : "");
    mTags.innerHTML = (v.tags || []).map(function (t) {
      return '<span class="mini-tag">' + escapeHtml(t) + "</span>";
    }).join("");
    mDesc.textContent = v.description || "暂无简介。";
    renderList();
  }

  // ============ 工具 ============
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ============ 事件 ============
  var searchTimer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = searchEl.value.trim();
      applyFilter();
    }, 180);
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); if (video.paused) video.play(); else video.pause(); }
  });

  // ============ 启动 ============
  loadData();
})();
</script>
</body>
</html>
